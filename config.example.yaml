network:
  rpc_endpoint: https://api.mainnet-beta.solana.com
  commitment: confirmed

wallets:
  - name: primary
    address: 9u6e...demo
    private_key_path: secrets/primary.json
    max_allocation_pct: 0.6
  - name: treasury
    address: 4sd8...demo
    private_key_path: secrets/treasury.json
    max_allocation_pct: 0.4

strategy:
  harvest_interval_minutes: 180
  rotation_threshold_bps: 75
  min_apy: 6.0
  slippage_bps: 30
  target_vaults: ["RAY-USDC", "SOL-USDC", "BONK-USDC"]

notifications:
  telegram:
    enabled: true
    bot_token: "<bot-token>"
    chat_id: "<chat-id>"
  discord:
    enabled: false
    webhook_url: ""

analytics:
  dashboard_refresh_seconds: 30

