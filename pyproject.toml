[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solana-yield-farming-optimizer"
version = "0.1.0"
description = "Smart Solana LP optimizer with APY rotation, harvesting, and alerting."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Team" }]
dependencies = [
    # Core dependencies
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "aiohttp>=3.9",
    "httpx>=0.27",

    # Solana blockchain integration
    "solana>=0.34.0",
    "solders>=0.21.0",
    "anchorpy>=0.20.1",
    "base58>=2.1.1",

    # Database and persistence
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",

    # Retry logic and resilience
    "tenacity>=8.2.3",

    # Monitoring and metrics
    "prometheus-client>=0.20.0",

    # Cryptography for secure key storage
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.25",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
solana-optimizer = "optimizer.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"

